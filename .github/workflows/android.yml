name: Android build (APK)

on:
  push:
    branches: [master]
    paths: ["client-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > client-android/local.properties
      - name: Build debug APK
        working-directory: client-android
        run: gradle :app:assembleDebug --no-daemon || sudo gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Veil-Android-debug
          path: client-android/app/build/outputs/apk/debug/*.apk
