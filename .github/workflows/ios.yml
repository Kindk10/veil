name: iOS build (IPA на macOS-раннере)

on:
  push:
    branches: [master]
    paths: ["client-ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: WebRTC framework (stasel prebuilt)
        working-directory: client-ios
        run: |
          url="https://github.com/stasel/WebRTC/releases/download/155.0.0/WebRTC-M155.xcframework.zip"
          curl -sL -o webrtc.zip "$url"
          unzip -q webrtc.zip
          ls WebRTC.xcframework
          cp -R WebRTC.xcframework/ios-x86_64_arm64-simulator/WebRTC.framework .

      - name: Compile Swift sources into Veil.app (unsigned)
        working-directory: client-ios
        run: |
          mkdir -p Veil.app/Frameworks
          swiftc \
            -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target x86_64-apple-ios17.0-simulator \
            -framework SwiftUI -framework UIKit -framework WebRTC \
            -F . \
            -parse-as-library \
            VeilApp.swift Envelope.swift VeilCall.swift CallView.swift CoverTraffic.swift Transport.swift VeilApi.swift SecureStorage.swift \
            -emit-executable -o Veil.app/Veil
          cp -R WebRTC.framework Veil.app/Frameworks/
          cp Info.plist Veil.app/Info.plist
          ls -la Veil.app/

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r client-ios/Veil.app Payload/
          zip -r Veil-unsigned.ipa Payload
          ls -la Veil-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-iOS-unsigned
          path: Veil-unsigned.ipa
